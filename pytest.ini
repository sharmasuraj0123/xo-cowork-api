; Pytest configuration.
;
; A standalone pytest.ini rather than a [tool.pytest.ini_options] table: this
; repo has no pyproject.toml and no packaging story (it is deployed as a source
; tree, not installed), so there is nothing to hang the table off. Its presence
; here also pins rootdir to the repo root, which is what puts `tests/` on
; sys.path for the `import fakes` helper module.

[pytest]
testpaths = tests

; --strict-markers: an unregistered @pytest.mark.<x> is an error, not a silent
;   no-op — a typo'd marker must never quietly deselect nothing.
; --strict-config: an unknown key in this file is an error rather than being
;   ignored, so a stale option can't rot unnoticed.
addopts = -q --strict-markers --strict-config

markers =
    subprocess: spawns a fresh interpreter (the per-agent import + route-parity matrix). Slow; the agent under test is chosen via AGENT_NAME in the child env, which is why it cannot run in-process.

; NOTE: there is deliberately no `filterwarnings = error` here.
;
; `sinks/todos.py:40` and `sinks/sessions_augment.py:61` both still call the
; deprecated `datetime.utcnow()`. Migrating them to `datetime.now(timezone.utc)`
; is out of scope this cycle, so a blanket error filter would make the suite red
; on arrival over a warning nobody is currently allowed to fix. Revisit once
; those two call sites move.
